{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delete Recipe</title>
  <link rel="stylesheet" href="{% static 'homeapp/style.css' %}">
</head>
<body>
  <main style="padding:120px 40px;max-width:800px;margin:0 auto;color:var(--cream)">
    <h1 class="heading-xl">Delete Recipe</h1>
    <p>Are you sure you want to delete <strong>{{ recipe.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Yes, delete</button>
      <a href="{% url 'homeapp:recipe_detail' recipe.slug %}" class="btn btn-ghost">Cancel</a>
    </form>
  </main>
</body>
</html>
