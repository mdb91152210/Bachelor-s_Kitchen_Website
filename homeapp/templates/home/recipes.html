{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recipes — Bachelor's Kitchen</title>
  <link rel="stylesheet" href="{% static 'homeapp/style.css' %}">
  <script src="{% static 'homeapp/script.js' %}"></script>
</head>
<body>
  <main style="padding:120px 40px;max-width:1100px;margin:0 auto;color:var(--cream)">
    <h1 class="heading-xl">All Recipes</h1>
    <p style="margin-bottom:20px">Browse recipes from the database.</p>
    <div style="display:flex;gap:12px;margin-bottom:18px">
      <a href="{% url 'homeapp:recipe_create' %}" class="btn btn-primary">Add Recipe</a>
      <a href="/admin/" class="btn btn-ghost">Open Admin</a>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">
      {% for r in recipes %}
        <article class="bento-item" style="padding:0;background:var(--surface);">
          <a href="{% url 'homeapp:recipe_detail' r.slug %}" style="color:inherit;display:block">
            <img src="{{ r.image_url }}" alt="{{ r.name }}" style="height:180px;object-fit:cover;width:100%">
            <div style="padding:14px">
              <div class="bento-cat">{{ r.region }}</div>
              <h3 class="bento-name" style="margin:6px 0">{{ r.name }}</h3>
              <div style="color:var(--cream-3);font-size:.9rem">{{ r.time }} · {{ r.difficulty }}</div>
            </div>
          </a>
        </article>
      {% empty %}
        <p>No recipes yet.</p>
      {% endfor %}
    </div>
  </main>
</body>
</html>
